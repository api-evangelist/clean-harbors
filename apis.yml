description: 'Clean Harbors is the largest provider of environmental and industrial services in North
  America — hazardous and non-hazardous waste management, emergency response, industrial cleaning, remediation,
  and used-oil and solvent recycling through its Safety-Kleen subsidiary. It runs no developer programme:
  no developer portal, no API documentation, no SDK in any registry, no GitHub organisation, and no /.well-known/
  document on any host. Customers use the authenticated Clean Harbors Online Services portal at clhsaas.cleanharbors.com
  and the EPA''s RCRA e-Manifest programme, whose machine-readable surface belongs to the EPA. Two callable
  contracts nonetheless run on Clean Harbors hosts, both found by direct probing: an anonymous, fully
  introspectable GraphQL endpoint at store.safety-kleen.com fronting six brand storefronts on one Adobe
  Commerce instance, and an unauthenticated Job Query API at careers.cleanharbors.com that the company
  documents in a published llms.txt.'
apis:
- aid: clean-harbors:careers-jobs
  name: Clean Harbors Careers Job Query API
  description: 'Unauthenticated JSON API over Clean Harbors'' open positions, served from the company''s
    own careers host and documented by the company in its published llms.txt. One HTTP GET endpoint selects
    among four operations with a `tool` query parameter — search_jobs, get_job, list_departments and list_locations
    — and returns paged JSON. A bare GET returns a self-describing tool manifest. All four operations
    were called anonymously on 2026-09-05 and returned HTTP 200; search_jobs reported 1,023 open requisitions.
    Despite the /api/mcp/ path this is not an MCP server: a JSON-RPC tools/list POST returns 405. The
    careers platform is AppVault; the host, the data and the postings are Clean Harbors''.'
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://careers.cleanharbors.com/
  baseURL: https://careers.cleanharbors.com/api/mcp/jobs
  tags:
  - Careers
  - Job Postings
  - Recruiting
  - Agent Readable
