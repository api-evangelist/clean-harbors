    type: X-CustomerPortal
  - url: https://www.cleanharbors.com/chos-reference-guides
    type: Documentation
  description: 'Clean Harbors Online Services (CHOS) — the authenticated web portal where customers create
    waste profiles, raise drum and bulk service requests, manage on-site waste inventory, and retrieve
    manifests, shipping documents, reports and invoices. Human login only: there is no token endpoint,
    no OpenID Connect discovery document (/.well-known/openid-configuration returns 404) and no documented
    programmatic access. The company publishes quick-reference guides for it but no API.'
  baseURL: https://clhsaas.cleanharbors.com/
- aid: clean-harbors:e-manifest
  name: EPA e-Manifest Integration
  tags:
  - EPA
  - e-Manifest
  - RCRA
  - Hazardous Waste
  - Regulatory
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.epa.gov/e-manifest
  properties:
  - url: https://www.epa.gov/e-manifest
    type: Documentation
  - url: https://www.cleanharbors.com/contact-us/e-manifest
    type: X-ProviderStatement
  - url: conformance/clean-harbors-conformance.yml
    type: Conformance
  description: 'Clean Harbors participates in the EPA''s RCRA e-Manifest programme for hazardous-waste
    manifest tracking. Its own e-Manifest page states the company "is in compliance, initially using the
    paper manifest option" and uploads all required manifest data and scans to the EPA, with fully electronic
    and hybrid transmission to the EPA CDX system planned. This is a regulatory participation, not a Clean
    Harbors contract: the machine-readable surface is the EPA''s at rcrainfo.epa.gov and is operated by
    the EPA. Clean Harbors publishes no manifest API of its own — which, given that the data model is
    already federally standardised, is the single largest gap in its public API surface.'
  baseURL: https://rcrainfo.epa.gov/
