id_conventions:
  commerce: >-
    The schema mixes integer `id` fields with opaque base64 `uid` fields (the ID scalar) on
    the newer types. There is no prefixed-id scheme (no `cus_`/`ord_` style prefixes), so an
    identifier alone does not tell an agent what it identifies.
  careers: >-
    Two unrelated identifier shapes coexist — numeric requisition ids on Job records and
    24-character hex object ids on Department records and on /job/ URLs.
