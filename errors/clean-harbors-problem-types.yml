    surface: careers-jobs
    http_status: 400
    title: Unknown tool
    detail: >-
      The `tool` query parameter named an operation the endpoint does not implement. The
      response body lists the four valid tool names.
    observed_example: >-
      {"error":"Unknown tool \"bogus_tool\". Available: search_jobs, get_job,
      list_departments, list_locations"}
    remediation: Call the endpoint with no parameters to retrieve the manifest of valid tools.
