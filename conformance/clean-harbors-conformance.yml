  - id: soap-wsdl
    name: SOAP 1.2 / WSDL contract
    conforms: false
    evidence: >-
      The Adobe Commerce SOAP endpoint exists at https://store.safety-kleen.com/soap but
      publishes no retrievable WSDL. GET /soap?wsdl_list=1 returns HTTP 200 carrying a SOAP
