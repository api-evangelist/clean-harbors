      the platform is configured to serve but cannot produce.
domain_standards:
  - id: epa-e-manifest
    name: EPA RCRA e-Manifest (Hazardous Waste Electronic Manifest Establishment Act)
    market: hazardous waste management
    participates: true
    contract_signature: false
    conforms: false
    evidence: >-
      https://www.cleanharbors.com/contact-us/e-manifest (HTTP 200) states that Clean Harbors
      "is in compliance, initially using the paper manifest option" and "uploads all required
      manifest data and manifest scans to the EPA", with fully electronic and hybrid
      transmission to the EPA CDX system planned.
    detail: >-
      This is a regulatory participation stated in prose, NOT a contract signature. Clean
      Harbors publishes no machine-readable manifest interface of its own — no schema, no
      endpoint, no message type. The electronic surface for e-Manifest is EPA's, at
      rcrainfo.epa.gov, and is operated by the EPA rather than by Clean Harbors. Recorded
      here so the sector standard is visible and so a later round does not mistake the prose
      claim for a published contract.
    remedy: >-
      Publishing a customer-facing manifest API — or even an OpenAPI for the manifest and
      shipment views already inside the CHOS portal — would be the single highest-value
      contract Clean Harbors could ship, because the data model is already federally
      standardised.
